name: Configurator production QA
on:
  pull_request:
    paths: ['configurator.html', 'assets/configurator-platforms.js', 'assets/configurator-ui.js', 'tools/test_configurator_contracts.cjs', 'tools/test_configurator.cjs', 'tools/test_configurator_homepage.cjs', 'tools/test_configurator_pdf_visual.py', 'tools/test_configurator_pdf_layout.cjs', 'tools/test_configurator_pdf_max.cjs', 'index.html', 'ko.html', 'de.html', 'configurator-preview.html', 'assets/configurator-preview.*', 'assets/configurator-tailwind.css', 'tailwind.configurator.config.cjs', 'assets/configurator-materials.js', 'assets/configurator-option-renderer.js', 'assets/configurator-parts-renderer.js', 'assets/configurator-bindrune-motifs.js', 'assets/configurator-geometry.js', 'assets/configurator-gramr-*', 'assets/configurator-bass-rear-geometry.js', 'assets/configurator-bass-front-geometry.js', 'assets/configurator-front/**', 'tools/extract_bass_front_geometry.py', 'assets/configurator-rear*', 'assets/configurator-rear/**', 'assets/configurator-drawing-renderer.js', 'assets/configurator-materials/**', 'assets/configurator-bindrune/**', 'tools/test_configurator_preview*.cjs', 'tools/package_configurator_preview.py', 'tools/build_configurator_standalone.py', '.github/workflows/configurator-preview.yml', 'tools/check_pages_freshness.py']
  # Live-site regressions are owned by main: audit Pages after each deploy and
  # daily, so a cancelled or stuck deploy is also reported.
  workflow_run:
    # Registered name and run display name of the dynamic Pages workflow.
    workflows: ['pages-build-deployment', 'pages build and deployment']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage:
    name: Homepage quote QA (${{ matrix.target }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # The PDF checks OCR rendered pages with the image's tesseract; ubuntu-latest
    # moved to 26.04, where they no longer read the totals. Keep 24.04 userland
    # in a container while using the available current hosted runner pool.
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 20
    # The live audit tests deployed main against main's own tests, so it says
    # nothing about this PR. Only the local candidate must pass to accept it;
    # on main (deploy, schedule) a live failure fails the run.
    continue-on-error: ${{ matrix.target == 'live' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(contains(fromJSON('["workflow_run","schedule"]'), github.event_name) && '["live"]' || '["candidate","live"]') }}
    steps:
      - name: Prepare Ubuntu 24.04 validation container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git curl sudo python3-venv
          python3 -m venv /opt/ravenforge-qa
          echo /opt/ravenforge-qa/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.target == 'live' && github.event.repository.default_branch || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load freshness check from this workflow's commit
        if: matrix.target == 'live'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools
          sparse-checkout: tools/check_pages_freshness.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check that Pages serves current main
        id: freshness
        if: matrix.target == 'live'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .workflow-tools/tools/check_pages_freshness.py https://raven-deadwire.github.io/RavenForge-Luthier-Intelligence/
          # Deploy lag is not a regression; the post-deploy run covers it.
          # Only the daily audit treats a still-stale site as a failed deploy.
          if [ "$EVENT_NAME" = schedule ] && grep -qx 'current=false' "$GITHUB_OUTPUT"; then
            echo '::error title=Pages behind main::GitHub Pages has not deployed the latest main; check the pages-build-deployment runs.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser and PDF inspection dependencies
        id: dependencies
        if: steps.freshness.outputs.current != 'false'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y fonts-noto-cjk tesseract-ocr
          python3 -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Serve candidate
        if: matrix.target == 'candidate'
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/homepage-http.log 2>&1 &
      - name: Verify embedded configurations and download 24 actual PDFs
        if: steps.freshness.outputs.current != 'false'
        env:
          CONFIGURATOR_QA_DIR: ${{ runner.temp }}/homepage-${{ matrix.target }}
          HOMEPAGE_URL: ${{ matrix.target == 'live' && 'https://raven-deadwire.github.io/RavenForge-Luthier-Intelligence/index.html' || 'http://127.0.0.1:8000/index.html' }}
        run: node tools/test_configurator.cjs --homepage --url "$HOMEPAGE_URL"
      - name: Inspect rendered PDF pages and amounts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python3 tools/test_configurator_pdf_visual.py "${{ runner.temp }}/homepage-${{ matrix.target }}" 24
      - name: Check PDF layout, scale and 1000-character instructions
        if: ${{ !cancelled() && matrix.target == 'candidate' && steps.dependencies.outcome == 'success' }}
        env:
          CONFIGURATOR_QA_DIR: ${{ runner.temp }}/homepage-candidate/layout
        run: node tools/test_configurator.cjs --pdf-layout --url http://127.0.0.1:8000/configurator.html
      - name: Inspect layout matrix PDF pages
        if: ${{ !cancelled() && matrix.target == 'candidate' && steps.dependencies.outcome == 'success' }}
        run: python3 tools/test_configurator_pdf_visual.py "${{ runner.temp }}/homepage-candidate/layout" 48
      - name: Check maximum priced option combinations and unbroken requests
        if: ${{ !cancelled() && matrix.target == 'candidate' && steps.dependencies.outcome == 'success' }}
        env:
          CONFIGURATOR_QA_DIR: ${{ runner.temp }}/homepage-candidate/max-options
          CONFIGURATOR_PDF_STRESS: '1'
        run: node tools/test_configurator.cjs --pdf-layout --url http://127.0.0.1:8000/configurator.html
      - name: Inspect maximum option PDFs
        if: ${{ !cancelled() && matrix.target == 'candidate' && steps.dependencies.outcome == 'success' }}
        run: python3 tools/test_configurator_pdf_visual.py "${{ runner.temp }}/homepage-candidate/max-options" 42
      - name: Upload separate homepage evidence
        if: always() && steps.freshness.outputs.current != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: configurator-homepage-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/homepage-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30
  preview:
    if: contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event_name)
    # The PDF checks OCR rendered pages with the image's tesseract; ubuntu-latest
    # moved to 26.04, where they no longer read the totals. Keep 24.04 userland
    # in a container while using the available current hosted runner pool.
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Prepare Ubuntu 24.04 validation container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git curl sudo python3-venv
          python3 -m venv /opt/ravenforge-qa
          echo /opt/ravenforge-qa/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check production parity and option coverage
        run: |
          node tools/test_configurator_contracts.cjs
          node tools/test_configurator_preview.cjs
      - name: Package isolated test files for review
        run: |
          python3 tools/package_configurator_preview.py "${{ runner.temp }}/configurator-preview/RavenForge-Configurator-Test.zip"
          python3 tools/build_configurator_standalone.py "${{ runner.temp }}/configurator-preview/RavenForge-Configurator-Test.html"
      - name: Install browser and Korean fonts
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y fonts-noto-cjk tesseract-ocr
          python3 -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Serve production configurator
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/preview-http.log 2>&1 &
      - name: Verify live preview in 24 model-language-viewport combinations
        env:
          PREVIEW_QA_DIR: ${{ runner.temp }}/configurator-preview/live
          PREVIEW_QA_URL: http://127.0.0.1:8000/configurator.html
        run: node tools/test_configurator_preview_browser.cjs
      - name: Preserve existing price, dependencies and PDF exports in 24 combinations
        env:
          CONFIGURATOR_QA_DIR: ${{ runner.temp }}/configurator-preview/regression
        run: node tools/test_configurator.cjs --matrix --url "http://127.0.0.1:8000/configurator.html"
      - name: Check every rendered PDF page for content, model and total
        run: python3 tools/test_configurator_pdf_visual.py "${{ runner.temp }}/configurator-preview/regression"
      - name: Upload reviewable screenshots and PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configurator-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/configurator-preview
          if-no-files-found: warn
          retention-days: 30
