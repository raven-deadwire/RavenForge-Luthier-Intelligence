name: Build RavenForge site assets

on:
  push:
    branches: [main]
    paths:
      - 'research/**/meta.json'
      - 'research/**/article-parts/**'
      - 'research/**/references-fragment.html'
      - 'concepts/**/meta.json'
      - 'tools/**'
      - 'EMBLA Prototype Design.png'
      - 'ASKR Prototype Design.png'
      - 'Edda Prototype Design.png'
      - 'Body Structure.png'
      - 'ravenforge.png'
      - 'assets/concepts/*.png'
      - 'assets/footer.js'
      - 'assets/footer-core.js'
      - 'assets/mentor-section.js'
      - 'assets/mentors/**'
      - 'assets/analysis-*.js'
      - '.github/workflows/build-research-index.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_ASSET_VERSION: '20260916s11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow
          npm install --no-save --no-package-lock jsdom@24

      - name: Migrate and build Concept Lab metadata
        run: |
          node tools/migrate_concepts.mjs
          python tools/optimize_site_images.py
          python tools/build_concept_index.py
          node tools/normalize_concept_runtime.mjs

      - name: Build Research metadata and static pages
        run: |
          python tools/build_research_index.py
          node tools/build_research_static.mjs

      - name: Build site shell, SEO and sitemap
        run: |
          python tools/build_site.py
          python tools/restore_configurator_iframe.py
          python tools/normalize_site_title.py
          sed -i -E "s#assets/footer\\.js\\?v=[^\"]+#assets/footer.js?v=${SITE_ASSET_VERSION}#" index.html

      - name: Commit generated site assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html configurator.html robots.txt sitemap.xml
          git add research/research-index.json
          git add research/*/*.html
          git add concepts
          git add assets/concept-lab.js assets/optimized assets/favicon.png assets/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Generated site assets are already up to date."
            exit 0
          fi
          git commit -m "Build static site assets and metadata"
          git push
