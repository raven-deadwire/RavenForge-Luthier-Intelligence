name: Build research index

on:
  push:
    branches: [main]
    paths:
      - 'research/**/meta.json'
      - 'tools/build_research_index.py'
      - '.github/workflows/build-research-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build research index
        run: python tools/build_research_index.py

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- research/research-index.json; then
            echo "Research index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/research-index.json
          git commit -m "Rebuild research metadata index"
          git push
