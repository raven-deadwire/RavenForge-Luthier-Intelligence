name: Internalize Analysis photos

# The sandbox that prepares changes cannot reach the makers' and retailers' image
# hosts, so the photos are fetched on a GitHub runner. It also runs when the
# Analysis media data changes, so a newly added hotlinked shot gets a local copy.
# The script leaves shots that already point at assets/analysis/ alone.
on:
  push:
    paths:
      - 'tools/internalize_analysis_images.py'
      - '.github/workflows/internalize-analysis-images.yml'
      - 'assets/analysis-media.js'
      - 'assets/analysis-media-data.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internalize-analysis-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  internalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download, scale down and point the shots at local WebP copies
        run: python tools/internalize_analysis_images.py
      - name: Commit local copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analysis assets/analysis-media.js assets/analysis-media-data.js tools/analysis-image-sources.json
          if git diff --cached --quiet; then
            echo "No hotlinked Analysis photos left to internalize."
            exit 0
          fi
          git commit -m "Serve Analysis photos as local WebP copies"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
