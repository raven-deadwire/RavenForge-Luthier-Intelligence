name: Configurator deployed QA
on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: 'Full commit SHA currently deployed to Pages'
        required: true
        type: string
permissions:
  contents: read
jobs:
  deployed:
    # The PDF checks OCR rendered pages with the image's tesseract; ubuntu-latest
    # moved to 26.04, where they no longer read the totals. Pin the image they pass on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      LIVE_ROOT: https://raven-deadwire.github.io/RavenForge-Luthier-Intelligence/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Match published configurator and assets to the deployed source
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, subprocess, urllib.parse, urllib.request
          paths = subprocess.check_output(['git', 'ls-files', '--', 'configurator.html', 'ravenforge.png', 'assets/configurator*', 'Edda Prototype Design.png', 'EMBLA Prototype Design.png', 'ASKR Prototype Design.png'], text=True).splitlines()
          assert paths and 'configurator.html' in paths
          def verify(name):
              url = os.environ['LIVE_ROOT'] + urllib.parse.quote(name, safe='/')
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = response.read()
              expected = pathlib.Path(name).read_bytes()
              result = {'path': name, 'sha256': hashlib.sha256(actual).hexdigest(), 'matches': actual == expected}
              assert result['matches'], 'Published/source mismatch: ' + name
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(verify, paths))
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'configurator-deployed'
          output.mkdir(exist_ok=True)
          (output / 'source-identity.json').write_text(json.dumps({'deployed_sha': os.environ['DEPLOYED_SHA'], 'url': os.environ['LIVE_ROOT'], 'files': results}, indent=2))
          print(f'PASS: {len(results)} published files match deployed source {os.environ["DEPLOYED_SHA"]}')
          PY
      - name: Install browser and Korean fonts
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk tesseract-ocr
          python3 -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Download real PDFs and check prices on live Pages in 24 combinations
        env:
          CONFIGURATOR_QA_DIR: ${{ runner.temp }}/configurator-deployed/regression
        run: node tools/test_configurator.cjs --matrix --url "https://raven-deadwire.github.io/RavenForge-Luthier-Intelligence/configurator.html"
      - name: Check every rendered PDF page for content, model and total
        run: python3 tools/test_configurator_pdf_visual.py "${{ runner.temp }}/configurator-deployed/regression"
      - name: Upload live-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configurator-deployed-${{ env.DEPLOYED_SHA }}
          path: ${{ runner.temp }}/configurator-deployed
          if-no-files-found: error
          retention-days: 30
