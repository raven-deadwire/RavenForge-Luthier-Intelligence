name: Migrate all research metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-all-research-metadata.yml'
      - 'tools/import_research_sheet_metadata.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import legacy Sheet metadata
        run: python tools/import_research_sheet_metadata.py

      - name: Rebuild research index
        run: python tools/build_research_index.py

      - name: Commit migrated research metadata
        shell: bash
        run: |
          if git diff --quiet -- research; then
            echo "No research metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -m "Migrate legacy research metadata to GitHub"
          git push
