name: Localize research images

on:
  push:
    branches: [main]
    paths:
      - 'tools/localize_research_images.py'
      - '.github/workflows/localize-research-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download and relink research images
        run: python tools/localize_research_images.py

      - name: Commit localized image assets
        shell: bash
        run: |
          if git diff --quiet -- research; then
            echo "No research image changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -m "Localize research document images"
          git push
