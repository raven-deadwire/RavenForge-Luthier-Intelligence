name: Prebuilt Tailwind CSS

# index.html and the configurator pages no longer use the cdn.tailwindcss.com
# runtime; assets/tailwind.css and assets/configurator-tailwind.css are compiled
# ahead of time. Keep them in sync with the classes used on the pages.
on:
  pull_request:
    paths: ['index.html', 'configurator.html', 'configurator-preview.html', 'assets/*.js', 'tailwind.config.cjs', 'tailwind.configurator.config.cjs', 'tools/tailwind.input.css', 'tools/build_tailwind_css.sh', 'assets/tailwind.css', 'assets/configurator-tailwind.css', '.github/workflows/homepage-tailwind.yml']
  push:
    branches: [main]
    paths: ['index.html', 'configurator.html', 'configurator-preview.html', 'assets/*.js', 'tailwind.config.cjs', 'tailwind.configurator.config.cjs', 'tools/tailwind.input.css', 'tools/build_tailwind_css.sh', '.github/workflows/homepage-tailwind.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-tailwind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build prebuilt Tailwind CSS
        run: bash tools/build_tailwind_css.sh
      - name: Fail the PR when the committed CSS is stale
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- assets/tailwind.css assets/configurator-tailwind.css; then
            echo "::error::Prebuilt Tailwind CSS is out of date. Run tools/build_tailwind_css.sh and commit the result."
            git diff --stat -- assets/tailwind.css assets/configurator-tailwind.css
            exit 1
          fi
      - name: Commit rebuilt CSS
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tailwind.css assets/configurator-tailwind.css
          if git diff --cached --quiet; then
            echo "Prebuilt Tailwind CSS is already up to date."
            exit 0
          fi
          git commit -m "Rebuild prebuilt Tailwind CSS"
          git push
