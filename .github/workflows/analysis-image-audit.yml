name: Analysis image link audit

# The Analysis card images are hotlinked from makers' and retailers' sites and
# can disappear. This reports every shot whose src and fallback both fail, and
# the run fails when any are broken. It also runs weekly, so a photo that
# vanishes from a maker's site is noticed without waiting for the next commit
# (GitHub emails the failure of a scheduled run).
on:
  push:
    paths: ['assets/analysis-media-data.js', 'assets/analysis-media.js', 'tools/audit_analysis_images.cjs', 'tools/find_image_candidates.cjs', 'tools/image-candidates.json', '.github/workflows/analysis-image-audit.yml']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every Analysis image URL
        run: node tools/audit_analysis_images.cjs "${{ runner.temp }}/analysis-image-audit.json"
      - name: List replacement candidates (when tools/image-candidates.json is present)
        if: always() && hashFiles('tools/image-candidates.json') != ''
        run: node tools/find_image_candidates.cjs tools/image-candidates.json "${{ runner.temp }}/image-candidates.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-image-audit
          path: ${{ runner.temp }}/*.json
          retention-days: 14
