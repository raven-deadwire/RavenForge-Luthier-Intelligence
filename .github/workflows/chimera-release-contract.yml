name: Chimera website release contract

on:
  pull_request:
    paths: ['index.html', 'manual/chimera.html', 'assets/chimera*', 'assets/chimera/**', 'tools/*chimera*', '.github/workflows/chimera-release-contract.yml']
  push:
    branches: [main, 'automation/chimera-1.3-homepage-20261010']
    paths: ['index.html', 'manual/chimera.html', 'assets/chimera*', 'assets/chimera/**', 'tools/*chimera*', '.github/workflows/chimera-release-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chimera-website-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  content:
    name: Chimera content and link contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@24
      - run: node --check assets/chimera.js
      - run: python -m unittest discover -s tools -p test_chimera_release.py -v
      - run: python tools/verify_chimera_release.py --offline --report validation/chimera-offline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chimera-website-content-${{ github.sha }}
          path: validation/chimera-offline.json

  public-release:
    name: Chimera public release and assets
    needs: content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund jsdom@24
      # No token, no continue-on-error and no draft-PR exemption: a 404 must block.
      - run: python tools/verify_chimera_release.py --report validation/chimera-public.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chimera-website-public-${{ github.sha }}
          path: validation/chimera-public.json
