<!doctype html>
<!-- Minimal three.js page used by check.cjs. Loads /model.glb, frames it, and reports what it found. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1b1b1b;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search), view = q.get('view') || 'three', variant = q.get('variant');
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b1b1b);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
new GLTFLoader().load('model.glb', g => {
  scene.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  let meshes = 0, withStatus = 0;
  g.scene.traverse(o => { if (o.isMesh) meshes++; if (o.userData && o.userData.rf_status) withStatus++; });
  const cam = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.01, 20);
  // glTF axes: X along the strings, Y up out of the top, Z toward the bass side.
  const dirs = {three: [0.55, 0.75, 0.75], top: [0, 1, 0.0001], back: [0.35, -0.8, 0.6], body: [0.55, 0.75, 0.75]};
  const d = new THREE.Vector3(...dirs[view]).normalize();
  let target = c.clone(), dist = Math.max(s.x, s.z) * 2.5;
  if (view === 'body') { target = new THREE.Vector3(box.max.x - 0.22, c.y, c.z); dist = 1.1; }
  cam.position.copy(target).addScaledVector(d, dist); cam.lookAt(target);
  // Finish variants (KHR_materials_variants). three.js exposes the data; switching is up to the page.
  const ext = (g.userData.gltfExtensions || {})['KHR_materials_variants'];
  const variants = ext ? ext.variants.map(v => v.name) : [];
  const swaps = [];
  if (variant !== null) {
    const vi = variants.indexOf(variant);
    g.scene.traverse(o => {
      const me = o.isMesh && o.userData.gltfExtensions && o.userData.gltfExtensions['KHR_materials_variants'];
      if (!me) return;
      const map = me.mappings.find(m => m.variants.includes(vi));
      if (map) swaps.push(g.parser.getDependency('material', map.material).then(m => { o.material = m; g.parser.assignFinalMaterial(o); }));
    });
  }
  Promise.all(swaps).then(() => {
  r.render(scene, cam);
  // colour of one point on the body top, bass side of the lower bout
  const pt = new THREE.Vector3(box.max.x - 0.09, box.max.y - 0.0191, box.max.z - 0.06).project(cam);
  const gl = r.getContext(), px = new Uint8Array(4);
  gl.readPixels(Math.round((pt.x + 1) / 2 * gl.drawingBufferWidth), Math.round((pt.y + 1) / 2 * gl.drawingBufferHeight), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  window.result = {loaded: true, meshes, nodesWithStatus: withStatus, variants, variant, swapped: swaps.length, bodyPixel: [px[0], px[1], px[2]],
    size_mm: [s.x, s.y, s.z].map(v => Math.round(v * 100000) / 100),
    notice: g.asset && g.asset.extras ? g.asset.extras.notice_en : null,
    defaultFinish: g.asset && g.asset.extras ? g.asset.extras.default_finish : null};
  });
}, undefined, e => { window.result = {loaded: false, error: String(e)}; });
</script></body></html>
