<!doctype html>
<!-- Timing page used by perf.cjs: download, parse, first frame, steady frames, finish switch. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#1b1b1b;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const now = () => performance.now();
const r = new THREE.WebGLRenderer({antialias: true});
r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b1b1b);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const frame = () => new Promise(res => requestAnimationFrame(res));
(async () => {
  try {
    const t0 = now();
    const buf = await (await fetch('model.glb', {cache: 'no-store'})).arrayBuffer();
    const t1 = now();
    const g = await new Promise((res, rej) => new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).parse(buf, '', res, rej));
    const t2 = now();
    scene.add(g.scene);
    const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 20);
    const dist = Math.max(s.x, s.z) * (innerWidth < innerHeight ? 3.6 : 2.2);
    const place = a => { cam.position.set(c.x + Math.sin(a) * dist * 0.6, c.y + dist * 0.6, c.z + Math.cos(a) * dist * 0.6); cam.lookAt(c); };
    place(0.6); r.render(scene, cam); r.getContext().finish();
    const t3 = now();
    const info = {calls: r.info.render.calls, triangles: r.info.render.triangles, geometries: r.info.memory.geometries, textures: r.info.memory.textures};
    let texBytes = 0; const seen = new Set();
    g.scene.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) if (m.map && !seen.has(m.map.uuid)) { seen.add(m.map.uuid); texBytes += m.map.image.width * m.map.image.height * 4 * 4 / 3; } });
    // Draw time per frame, forcing the GPU work to finish. In headless Chromium this is a software
    // rasteriser on the host CPU and is not slowed by the CPU limit, so it is NOT a phone GPU figure.
    const dts = [];
    for (let i = 0; i < 12; i++) { place(0.6 + i * 0.05); const t = now(); r.render(scene, cam); r.getContext().finish(); dts.push(now() - t); await frame(); }
    dts.sort((a, b) => a - b);
    // finish switch
    const ext = (g.userData.gltfExtensions || {})['KHR_materials_variants'];
    let switchMs = null;
    if (ext) {
      const vi = ext.variants.length - 1, t4 = now(), jobs = [];
      g.scene.traverse(o => { const me = o.isMesh && o.userData.gltfExtensions && o.userData.gltfExtensions['KHR_materials_variants']; if (!me) return;
        const map = me.mappings.find(m => m.variants.includes(vi)); if (map) jobs.push(g.parser.getDependency('material', map.material).then(m => { o.material = m; g.parser.assignFinalMaterial(o); })); });
      await Promise.all(jobs); r.render(scene, cam); r.getContext().finish(); switchMs = now() - t4;
    }
    window.result = {ok: true, bytes: buf.byteLength, download_ms: t1 - t0, parse_ms: t2 - t1, first_frame_ms: t3 - t2, ready_ms: t3 - t0,
      software_draw_ms_median: dts[dts.length >> 1], switch_ms: switchMs, info,
      texture_gpu_bytes_estimate: Math.round(texBytes), canvas: [r.domElement.width, r.domElement.height],
      js_heap_bytes: performance.memory ? performance.memory.usedJSHeapSize : null,
      gl_renderer: (() => { const gl = r.getContext(), e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : null; })()};
  } catch (e) { window.result = {ok: false, error: String(e)}; }
})();
</script></body></html>
