<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1100" viewBox="0 0 920 1100" role="img" aria-labelledby="title desc"><title id="title">Halsrohling: Auswahl und Nachprüfung</title><desc id="desc">Der ursprüngliche Ablauf als Webdiagramm. HOLD führt zur Nachmessung zurück; bei Nichterfüllung der Anwendungskriterien folgen Ausschluss oder Umnutzung.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#376092" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="NanumGothic, Arial, sans-serif" fill="#202830"><text x="35" y="42" font-size="14" text-anchor="start" fill="#9d1c20">RAVENFORGE / NB01</text><text x="35" y="80" font-size="26" text-anchor="start" fill="#202830">Halsrohling: Auswahl und Nachprüfung</text><rect x="75" y="115" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="143" font-size="20" text-anchor="middle" fill="#202830">Materialhistorie</text><text x="315" y="166" font-size="14" text-anchor="middle" fill="#52677b">Holzart · Lieferant · Charge · Lagerung</text><path d="M315 190 L315 200" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="205" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="233" font-size="20" text-anchor="middle" fill="#202830">Ausgangsmessung</text><text x="315" y="256" font-size="14" text-anchor="middle" fill="#52677b">Maße · Masse · MC · RH/T · Geometrie</text><path d="M315 280 L315 290" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="295" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="323" font-size="20" text-anchor="middle" fill="#202830">Vorbearbeitung 1</text><text x="315" y="346" font-size="14" text-anchor="middle" fill="#52677b">Bearbeitungszugabe erhalten</text><path d="M315 370 L315 380" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="385" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="413" font-size="20" text-anchor="middle" fill="#202830">Warten / akklimatisieren</text><text x="315" y="436" font-size="14" text-anchor="middle" fill="#52677b">Zeit und Auflage dokumentieren</text><path d="M315 460 L315 470" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="475" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="503" font-size="20" text-anchor="middle" fill="#202830">Nachmessen</text><text x="315" y="526" font-size="14" text-anchor="middle" fill="#52677b">MC · Masse · bow / crook / twist</text><path d="M315 550 L315 560" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 560 L555 600 L315 640 L75 600 Z" fill="#eaf1f8" stroke="#376092"/><text x="315" y="605" font-size="19" text-anchor="middle" fill="#202830">Stabilitätskriterien erfüllt?</text><path d="M315 640 L315 670" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="675" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="703" font-size="20" text-anchor="middle" fill="#202830">Bearbeitung 2 · warten · nachprüfen</text><text x="315" y="726" font-size="14" text-anchor="middle" fill="#52677b">Gleiche Bezugsflächen und Bedingungen</text><path d="M315 750 L315 760" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="765" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="793" font-size="20" text-anchor="middle" fill="#202830">Halsrohling freigeben</text><text x="315" y="816" font-size="14" text-anchor="middle" fill="#52677b">Nächsten Arbeitsschritt freigeben</text><path d="M315 840 L315 850" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="855" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="883" font-size="20" text-anchor="middle" fill="#202830">Nuten · Profil · Endstabilisierung</text><text x="315" y="906" font-size="14" text-anchor="middle" fill="#52677b">Nach Geometrie-/Einspannungsänderung messen</text><path d="M315 930 L315 940" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="945" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="973" font-size="20" text-anchor="middle" fill="#202830">Endentscheidung: GO / HOLD / REJECT</text><text x="315" y="996" font-size="14" text-anchor="middle" fill="#52677b">Kriterienversion · Grund · Nachprüfanlass</text><text x="330" y="660" font-size="15" text-anchor="start" fill="#202830">Ja</text><path d="M555 600 L640 600" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><text x="595" y="585" font-size="15" text-anchor="middle" fill="#202830">Nein</text><rect x="645" y="565" width="240" height="70" rx="6" fill="#fff4e4" stroke="#b98a4b"/><text x="765" y="606" font-size="19" text-anchor="middle" fill="#202830">HOLD · beobachten</text><rect x="645" y="695" width="240" height="70" rx="6" fill="#fff4e4" stroke="#b98a4b"/><text x="765" y="736" font-size="19" text-anchor="middle" fill="#202830">REJECT / umnutzen</text><path d="M765 635 L765 690" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="665" font-size="14" text-anchor="start" fill="#202830">Nicht erfüllt</text><path d="M765 565 L765 510 L560 510" stroke="#376092" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="665" y="496" font-size="14" text-anchor="middle" fill="#202830">Nachmessen</text><text x="35" y="1064" font-size="14" text-anchor="start" fill="#52677b">Beispiel aus dem Ausgangsbericht · keine Messdaten oder Fertigungsnorm</text></g></svg>