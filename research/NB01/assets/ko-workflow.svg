<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1100" viewBox="0 0 920 1100" role="img" aria-labelledby="title desc"><title id="title">넥 블랭크 선별·재검사 흐름</title><desc id="desc">원문의 공정 흐름을 웹용 도식으로 복원. HOLD는 재측정으로 돌아가고, 해당 용도 기준 미달 시 제외·재용도를 검토한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#376092" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="NanumGothic, Arial, sans-serif" fill="#202830"><text x="35" y="42" font-size="14" text-anchor="start" fill="#9d1c20">RAVENFORGE / NB01</text><text x="35" y="80" font-size="26" text-anchor="start" fill="#202830">넥 블랭크 선별·재검사 흐름</text><rect x="75" y="115" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="143" font-size="20" text-anchor="middle" fill="#202830">목재 이력</text><text x="315" y="166" font-size="14" text-anchor="middle" fill="#52677b">수종 · 공급처 · 로트 · 건조·보관</text><path d="M315 190 L315 200" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="205" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="233" font-size="20" text-anchor="middle" fill="#202830">기준 측정</text><text x="315" y="256" font-size="14" text-anchor="middle" fill="#52677b">치수 · 질량 · MC · RH/T · 형상</text><path d="M315 280 L315 290" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="295" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="323" font-size="20" text-anchor="middle" fill="#202830">1차 여유 가공</text><text x="315" y="346" font-size="14" text-anchor="middle" fill="#52677b">최종치수보다 여유 유지</text><path d="M315 370 L315 380" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="385" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="413" font-size="20" text-anchor="middle" fill="#202830">대기·환경 적응</text><text x="315" y="436" font-size="14" text-anchor="middle" fill="#52677b">시간과 지지 조건 기록</text><path d="M315 460 L315 470" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="475" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="503" font-size="20" text-anchor="middle" fill="#202830">재측정</text><text x="315" y="526" font-size="14" text-anchor="middle" fill="#52677b">MC · 질량 · bow / crook / twist</text><path d="M315 550 L315 560" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 560 L555 600 L315 640 L75 600 Z" fill="#eaf1f8" stroke="#376092"/><text x="315" y="605" font-size="19" text-anchor="middle" fill="#202830">안정성 기준 충족?</text><path d="M315 640 L315 670" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="675" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="703" font-size="20" text-anchor="middle" fill="#202830">2차 가공 · 대기 · 재검사</text><text x="315" y="726" font-size="14" text-anchor="middle" fill="#52677b">동일 기준면과 조건으로 비교</text><path d="M315 750 L315 760" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="765" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="793" font-size="20" text-anchor="middle" fill="#202830">넥 블랭크 승인</text><text x="315" y="816" font-size="14" text-anchor="middle" fill="#52677b">다음 공정 승인</text><path d="M315 840 L315 850" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="855" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="883" font-size="20" text-anchor="middle" fill="#202830">채널 · 프로파일 · 최종 안정화</text><text x="315" y="906" font-size="14" text-anchor="middle" fill="#52677b">형상·구속 변경 뒤 다시 측정</text><path d="M315 930 L315 940" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="945" width="480" height="70" rx="6" fill="#eaf1f8" stroke="#9fb6d1"/><text x="315" y="973" font-size="20" text-anchor="middle" fill="#202830">최종 판정: GO / HOLD / REJECT</text><text x="315" y="996" font-size="14" text-anchor="middle" fill="#52677b">기준 버전 · 사유 · 재검토 조건</text><text x="330" y="660" font-size="15" text-anchor="start" fill="#202830">예</text><path d="M555 600 L640 600" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><text x="595" y="585" font-size="15" text-anchor="middle" fill="#202830">아니오</text><rect x="645" y="565" width="240" height="70" rx="6" fill="#fff4e4" stroke="#b98a4b"/><text x="765" y="606" font-size="19" text-anchor="middle" fill="#202830">HOLD · 추가 관찰</text><rect x="645" y="695" width="240" height="70" rx="6" fill="#fff4e4" stroke="#b98a4b"/><text x="765" y="736" font-size="19" text-anchor="middle" fill="#202830">REJECT / 재용도</text><path d="M765 635 L765 690" fill="none" stroke="#376092" stroke-width="2" marker-end="url(#arrow)"/><text x="775" y="665" font-size="14" text-anchor="start" fill="#202830">기준 미달</text><path d="M765 565 L765 510 L560 510" stroke="#376092" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="665" y="496" font-size="14" text-anchor="middle" fill="#202830">재측정</text><text x="35" y="1064" font-size="14" text-anchor="start" fill="#52677b">연구 원문의 예시 일정 · 실측 결과나 확정 제작 기준이 아님</text></g></svg>